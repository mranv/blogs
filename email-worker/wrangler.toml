name = "email-sender"
main = "src/index.ts"
compatibility_date = "2025-05-23"
compatibility_flags = ["nodejs_compat"]

# ── Email Sending binding ──────────────────────────────────────
# Cloudflare Email Service: sends from newsletter@techanv.com
# SPF/DKIM/MX already configured on techanv.com via Email Routing
# 
# NOTE: allowed_destination_addresses is omitted to allow sending to
# ANY confirmed subscriber. During the Email Service beta, Cloudflare
# may require addresses to be verified in the dashboard first.
# If sends fail for new addresses, add them here or verify in dashboard.

[[send_email]]
name = "SEND_EMAIL"

# ── Secret: shared auth key between Pages Functions and this Worker ──
# Set via: wrangler secret put EMAIL_WORKER_SECRET
# Pages Functions pass this in requests to authenticate
